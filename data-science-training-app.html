    <style>
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .slide-animation {
            animation: slideIn 0.5s ease-out;
        }
        .fade-animation {
            animation: fadeIn 0.3s ease-out;
        }
        .progress-fill {
            transition: width 0.5s ease-out;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .sidebar-item {
            transition: all 0.2s ease;
        }
        .sidebar-item:hover {
            transform: translateX(5px);
        }
        .tooltip {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip-parent:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        pre code {
            background: transparent !important;
        }
        .quiz-option {
            transition: all 0.3s ease;
        }
        .quiz-option:hover {
            transform: scale(1.02);
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>

                }
                if (e.key === 'k' && e.ctrlKey) {
                    e.preventDefault();
                    openSearch();
                }
                if (e.key === 'Escape') closeSearch();
            });
        }

        function openSearch() {
            document.getElementById('searchModal').classList.remove('hidden');
            document.getElementById('searchInput').focus();
        }

        function closeSearch() {
            document.getElementById('searchModal').classList.add('hidden');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            const results = slides.filter(slide => 
                slide.title.toLowerCase().includes(query) || 
                slide.content.toLowerCase().includes(query)
            );

            const resultsHtml = results.map(slide => `
                <div class="p-3 hover:bg-gray-100 rounded cursor-pointer" onclick="goToSlide(${slide.id}); closeSearch();">
                    <div class="font-medium">${slide.title}</div>
                    <div class="text-sm text-gray-600">Slide ${slide.id}</div>
                </div>
            `).join('');

            document.getElementById('searchResults').innerHTML = resultsHtml || '<div class="p-3 text-gray-500">No results found</div>';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
